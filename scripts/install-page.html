<!DOCTYPE html>
<html lang="en" class="device-desktop">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
    <title>Add {{APP_NAME}} to your Home Screen</title>
    <link rel="manifest" href="/__grok/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/__grok/icon-180.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #000;
        --fg: #f4f4f5;
        --muted: #a1a1aa;
        --card: #111113;
        --border: #27272a;
        --accent: #26a69a;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .page {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
      }
      .powered {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 28px;
      }
      .powered-brand {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--fg);
        font-weight: 600;
      }
      .app-logo {
        width: 16px;
        height: 16px;
        border-radius: 4px;
      }
      .content { flex: 1; display: flex; align-items: center; justify-content: center; }
      .copy {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px 24px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
        line-height: 1.25;
        letter-spacing: -0.02em;
      }
      .steps { color: var(--muted); font-size: 1rem; line-height: 1.5; }
      .step { margin: 0; }
      .desktop-note { color: var(--muted); margin: 0 0 20px; line-height: 1.5; }
      .desktop-open {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 10px;
        background: var(--accent);
        color: #04110f;
        font-weight: 600;
        text-decoration: none;
      }
      /* Mobile: show phone instructions, hide desktop block */
      .content-desktop { display: none; }
      .device-desktop .content:not(.content-desktop) { display: none; }
      .device-desktop .content-desktop { display: flex; }
      .device-phone .content-desktop,
      .device-tablet .content-desktop { display: none; }
    </style>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        var touch = navigator.maxTouchPoints || 0;
        var isiPad = /iPad/.test(ua) || (/Macintosh/.test(ua) && touch > 1);
        var isiPhone = /iPhone|iPod/.test(ua);
        var isIOS = isiPhone || isiPad;
        var isAndroid = /Android/i.test(ua);
        var isAndroidPhone = isAndroid && /Mobile/i.test(ua);
        var isAndroidTablet = isAndroid && !/Mobile/i.test(ua);
        var minSide = Math.min(screen.width || 0, screen.height || 0);
        var maxSide = Math.max(screen.width || 0, screen.height || 0);
        var type = "desktop";
        if (isiPhone) type = "phone";
        else if (isiPad || isAndroidTablet) type = "tablet";
        else if (isAndroidPhone) type = "phone";
        else if (touch > 0 && minSide > 0 && minSide <= 500) type = "phone";
        else if (touch > 0 && minSide > 500 && maxSide <= 1400) type = "tablet";
        var iosMajor = null;
        var osToken = null;
        var safariToken = null;
        var iphoneOs = ua.match(/iPhone OS (\d+)[._]/);
        var ipadOs = ua.match(/CPU OS (\d+)[._](\d+) like Mac OS X/);
        var safariVer = ua.match(/Version\/(\d+)[._]/);
        if (iphoneOs) osToken = parseInt(iphoneOs[1], 10);
        else if (ipadOs) osToken = parseInt(ipadOs[1], 10);
        if (isIOS && safariVer) safariToken = parseInt(safariVer[1], 10);
        if (osToken != null || safariToken != null) {
          iosMajor = Math.max(osToken || 0, safariToken || 0);
        }
        var root = document.documentElement;
        var classes = ["device-" + type];
        if (iosMajor != null) {
          root.dataset.ios = String(iosMajor);
          classes.push(iosMajor >= 27 ? "ios-27-plus" : "ios-below-27");
        }
        root.className = classes.join(" ");
      })();
    </script>
  </head>
  <body>
    <div class="page">
      <header class="powered" aria-label="Powered by Grok">
        <span class="powered-by">Powered by</span>
        <span class="powered-brand">
          <img class="app-logo" src="/favicon.svg" width="16" height="16" alt="" />
          <span class="powered-grok">Grok</span>
        </span>
      </header>
      <main class="content">
        <section class="copy">
          <h1>Add {{APP_NAME}} to your&nbsp;Home&nbsp;Screen</h1>
          <div class="steps">
            <p class="step">Tap Share, then Add to Home Screen</p>
          </div>
        </section>
      </main>
      <main class="content content-desktop">
        <section class="copy">
          <h1>Open this link on your iPhone&nbsp;or&nbsp;iPad</h1>
          <p class="desktop-note">This page shows how to add {{APP_NAME}} to an iOS Home Screen.</p>
          <a class="desktop-open" href="{{APP_URL}}">Open {{APP_NAME}}</a>
        </section>
      </main>
    </div>
  </body>
</html>
